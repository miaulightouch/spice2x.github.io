name: Publish validated fork release

on:
  push:
    branches: [release/resize-api-2026-10-16]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: b1f2fdb918a79b6b65f178291577b2b8c3d852d0
      CI_HEAD_SHA: 5dad56cc2545bba871aee9028784957c9eea0740
      CI_RUN_ID: '38833325591'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: b1f2fdb918a79b6b65f178291577b2b8c3d852d0
          fetch-depth: 0
      - name: Verify successful CI and matching source tree
        run: |
          test "$(gh run view "$CI_RUN_ID" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$CI_RUN_ID" --json headSha --jq .headSha)" = "$CI_HEAD_SHA"
          git fetch origin "$CI_HEAD_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$CI_HEAD_SHA^{tree}")"
      - name: Resolve fork version
        run: |
          tag=$(python3 scripts/fork_version.py)
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Verify resize API behavior
        working-directory: src/spice2x
        run: |
          python3 api/tests/run_resize_tests.py
          python3 api/tests/run_control_tests.py
          python3 api/tests/run_config_path_tests.py
      - name: Download validated CI binaries
        run: |
          artifact=$(gh api "repos/$GH_REPO/actions/runs/$CI_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name')
          test -n "$artifact"
          [[ "$artifact" =~ ^spice2x-ci-[0-9a-f]{7,40}$ ]]
          artifact_tree=$(gh api "repos/$GH_REPO/commits/${artifact#spice2x-ci-}" --jq '.commit.tree.sha')
          test "$(git rev-parse 'HEAD^{tree}')" = "$artifact_tree"
          gh run download "$CI_RUN_ID" --name "$artifact" --dir "$RUNNER_TEMP/resize-ci"
          test -f "$RUNNER_TEMP/resize-ci/spice2x/spice.exe"
          test -f "$RUNNER_TEMP/resize-ci/spice2x/spice64.exe"
          test -f "$RUNNER_TEMP/resize-ci/spice2x/extras/winxp/spice.exe"
          test -f "$RUNNER_TEMP/resize-ci/spice2x/extras/winxp/spicecfg.exe"
      - name: Package standard and full distributions
        run: |
          cp FORK_VERSION "$RUNNER_TEMP/resize-ci/spice2x/FORK_VERSION"
          cd "$RUNNER_TEMP/resize-ci/spice2x"
          zip -qrXT9 "$RUNNER_TEMP/spice2x-$RELEASE_TAG.zip" . -x 'extras/*'
          zip -qrXT9 "$RUNNER_TEMP/spice2x-$RELEASE_TAG-full.zip" .
      - name: Package XP executables
        run: |
          mkdir "$RUNNER_TEMP/xp-package"
          cp "$RUNNER_TEMP/resize-ci/spice2x/extras/winxp/spice.exe" "$RUNNER_TEMP/xp-package/"
          cp "$RUNNER_TEMP/resize-ci/spice2x/extras/winxp/spicecfg.exe" "$RUNNER_TEMP/xp-package/"
          cp LICENSE "$RUNNER_TEMP/xp-package/LICENSE.txt"
          cp FORK_VERSION "$RUNNER_TEMP/xp-package/FORK_VERSION"
          cat > "$RUNNER_TEMP/xp-package/README.txt" <<'README'
          XP 32-bit executables for an existing spice2x installation.
          Back up and replace the existing XP spice.exe and spicecfg.exe.
          Preserve existing game files, modules and launch arguments.
          Use -configdir "%APPDATA%\spice" for a shared settings directory,
          or -portable to read/write beside the EXE. Per-file paths take priority.
          Copy existing settings to the chosen root before switching.
          Remembers the saved calibration scene across game restarts.
          Choose a settings directory verified to survive Embedded write filters.
          Calibration uses spicetools_screen_resize.json within that directory.
          Includes XP-compatible power-off and experimental legacy jubeat OpenGL
          calibration. WGL behavior, legacy GPU drivers and actual XP shutdown
          still require testing on the target machine.
          README
          cd "$RUNNER_TEMP/xp-package"
          zip -qrXT9 "$RUNNER_TEMP/spice2x-$RELEASE_TAG-winxp.zip" .
      - name: Publish prerelease
        run: |
          cat > "$RUNNER_TEMP/resize-api-release-notes.md" <<'NOTES'
          - Remove the separate screen resize config path override.
          - Calibration now uses the common settings directory and the fixed filename
            spicetools_screen_resize.json. Choose a directory with -configdir (including
            %APPDATA%\spice or any writable path), or -portable to store beside the EXE.
          - Update setup and Embedded persistence instructions to use the shared directory.

          Setup: https://github.com/miaulightouch/spice2x.github.io/blob/main/docs/Fork-setup.md

          Upstream version: 26-10-03. Source snapshot: upstream main c83496776e4dfa06f286e483d21fd269c331505c
          (2026-10-12), six commits after that release. Fork changes are applied on top.

          The -winxp.zip contains XP 32-bit spice.exe and spicecfg.exe for an existing installation;
          preserve game files, modules and launch arguments. The standard ZIP contains regular binaries,
          and the full ZIP includes XP extras. All archives include FORK_VERSION.

          Validation: existing GNU/XP and MSVC CI builds; 161 resize API checks + 400 concurrent updates;
          config-path regressions; native power-control checks for SPICE_XP=0 and 1.
          Target-machine WGL/ATI behavior and XP shutdown still require testing on the cabinet.
          See PR #6. Main and the source PR have no GitHub Actions changes.

          NOTES
          printf '\nCI: https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$CI_RUN_ID" \
            >> "$RUNNER_TEMP/resize-api-release-notes.md"
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/spice2x-$RELEASE_TAG.zip" \
            "$RUNNER_TEMP/spice2x-$RELEASE_TAG-full.zip" \
            "$RUNNER_TEMP/spice2x-$RELEASE_TAG-winxp.zip" \
            --target "$RELEASE_COMMIT" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/resize-api-release-notes.md" \
            --prerelease
