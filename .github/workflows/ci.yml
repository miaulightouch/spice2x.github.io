name: Publish validated calibration persistence release

on:
  push:
    branches: [release/resize-api-2026-10-16]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: a27620a6b7d3c680723980e58e9dc05c625d6d58
      CI_HEAD_SHA: b5382687f1d0b7c4a841e9912b68789f7a26b8ef
      CI_RUN_ID: '38792598917'
      RELEASE_TAG: 26-10-16-xp-opengl.3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a27620a6b7d3c680723980e58e9dc05c625d6d58
          fetch-depth: 0
      - name: Verify successful CI and matching source tree
        run: |
          test "$(gh run view "$CI_RUN_ID" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$CI_RUN_ID" --json headSha --jq .headSha)" = "$CI_HEAD_SHA"
          git fetch origin "$CI_HEAD_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$CI_HEAD_SHA^{tree}")"
      - name: Verify resize API behavior
        working-directory: src/spice2x
        run: |
          python3 api/tests/run_resize_tests.py
          python3 api/tests/run_control_tests.py
      - name: Download validated CI binaries
        run: |
          artifact=$(gh api "repos/$GH_REPO/actions/runs/$CI_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name')
          test -n "$artifact"
          gh run download "$CI_RUN_ID" --name "$artifact" --dir "$RUNNER_TEMP/resize-ci"
          test -f "$RUNNER_TEMP/resize-ci/spice2x/spice.exe"
          test -f "$RUNNER_TEMP/resize-ci/spice2x/spice64.exe"
          test -f "$RUNNER_TEMP/resize-ci/spice2x/extras/winxp/spice.exe"
          test -f "$RUNNER_TEMP/resize-ci/spice2x/extras/winxp/spicecfg.exe"
      - name: Package standard and full distributions
        run: |
          cd "$RUNNER_TEMP/resize-ci/spice2x"
          zip -qrXT9 "$RUNNER_TEMP/spice2x-$RELEASE_TAG.zip" . -x 'extras/*'
          zip -qrXT9 "$RUNNER_TEMP/spice2x-$RELEASE_TAG-full.zip" .
      - name: Package XP executables
        run: |
          mkdir "$RUNNER_TEMP/xp-package"
          cp "$RUNNER_TEMP/resize-ci/spice2x/extras/winxp/spice.exe" "$RUNNER_TEMP/xp-package/"
          cp "$RUNNER_TEMP/resize-ci/spice2x/extras/winxp/spicecfg.exe" "$RUNNER_TEMP/xp-package/"
          cp LICENSE "$RUNNER_TEMP/xp-package/LICENSE.txt"
          cat > "$RUNNER_TEMP/xp-package/README.txt" <<'README'
          XP 32-bit executables for an existing spice2x installation.
          Back up and replace the existing XP spice.exe and spicecfg.exe.
          Preserve existing game files, modules and launch arguments.
          Remembers the saved calibration scene across game restarts.
          Use -resizecfgpath for a path verified to survive Embedded write filters.
          Includes XP-compatible power-off and experimental legacy jubeat OpenGL
          calibration. WGL behavior, legacy GPU drivers and actual XP shutdown
          still require testing on the target machine.
          README
          cd "$RUNNER_TEMP/xp-package"
          zip -qrXT9 "$RUNNER_TEMP/spice2x-$RELEASE_TAG-winxp.zip" .
      - name: Publish prerelease
        run: |
          cat > "$RUNNER_TEMP/resize-api-release-notes.md" <<'NOTES'
          Calibration now restores the selected scene after restarting the game.

          - Saves and reloads the active scene along with all four scene settings, enabled state, and filtering.
          - Legacy files without an active scene still default to Scene 1. Invalid indices fall back safely.
          - After upgrading, select the desired scene and save once.
          - Embedded XP EWF/FBWF can still discard accepted file writes after a full reboot.
            Use the existing -resizecfgpath override with a location verified to survive reboot;
            see docs/Fork-setup.md for diagnosis. This release does not change write-filter settings.
          - README and usage notes document only this fork's additions, following Proton-BM's style.
          - The hosted Web controller has a more compact layout and English, Traditional Chinese,
            Simplified Chinese, Japanese, and Korean interfaces. Web assets update separately.

          Scene persistence is shared config behavior across Windows builds. XP-specific WGL hooks
          and power-off flags remain guarded by SPICE_XP; non-XP shutdown policy is unchanged.

          The -winxp.zip contains XP 32-bit spice.exe and spicecfg.exe for an existing installation.
          Back up and replace those executables, preserving game data and launch arguments.
          The standard archive contains regular binaries; the full archive includes XP extras.

          Validation: existing GNU/XP and MSVC CI builds, 161 production resize/config checks,
          400 concurrent updates, and the native control/privilege checks for SPICE_XP=0 and 1.
          Web: 33 tests, Vue/TypeScript checks, production build, and live five-language demo checks.
          The user verified the previous XP OpenGL transform on the target cabinet; this new scene
          persistence fix still needs a target-machine restart check. No Windows runtime test is claimed.
          See PR #4. Main and the source PR have no workflow changes.

          NOTES
          printf '\nCI: https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$CI_RUN_ID" \
            >> "$RUNNER_TEMP/resize-api-release-notes.md"
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/spice2x-$RELEASE_TAG.zip" \
            "$RUNNER_TEMP/spice2x-$RELEASE_TAG-full.zip" \
            "$RUNNER_TEMP/spice2x-$RELEASE_TAG-winxp.zip" \
            --target "$RELEASE_COMMIT" \
            --title "spice2x calibration persistence (revision 3)" \
            --notes-file "$RUNNER_TEMP/resize-api-release-notes.md" \
            --prerelease
