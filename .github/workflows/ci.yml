name: Publish validated Resize API Release

on:
  push:
    branches: [release/resize-api-2026-10-16]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: 36bc9a0fb751006cda4502b0eb5f1a66b69010d7
      CI_HEAD_SHA: 0303828e8155acd88d6f4cab1584f555f1a7a2d0
      CI_RUN_ID: '38770857262'
      RELEASE_TAG: 26-10-16-resize-api.1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 36bc9a0fb751006cda4502b0eb5f1a66b69010d7
          fetch-depth: 0
      - name: Verify successful CI and matching source tree
        run: |
          test "$(gh run view "$CI_RUN_ID" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$CI_RUN_ID" --json headSha --jq .headSha)" = "$CI_HEAD_SHA"
          git fetch origin "$CI_HEAD_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$CI_HEAD_SHA^{tree}")"
      - name: Verify resize API behavior
        working-directory: src/spice2x
        run: python3 api/tests/run_resize_tests.py
      - name: Download validated CI binaries
        run: |
          artifact=$(gh api "repos/$GH_REPO/actions/runs/$CI_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name')
          test -n "$artifact"
          gh run download "$CI_RUN_ID" --name "$artifact" --dir "$RUNNER_TEMP/resize-ci"
          test -f "$RUNNER_TEMP/resize-ci/spice2x/spice.exe"
          test -f "$RUNNER_TEMP/resize-ci/spice2x/spice64.exe"
      - name: Package standard and full distributions
        run: |
          cd "$RUNNER_TEMP/resize-ci/spice2x"
          zip -qrXT9 "$RUNNER_TEMP/spice2x-$RELEASE_TAG.zip" . -x 'extras/*'
          zip -qrXT9 "$RUNNER_TEMP/spice2x-$RELEASE_TAG-full.zip" .
      - name: Publish prerelease
        run: |
          cat > "$RUNNER_TEMP/resize-api-release-notes.md" <<'NOTES'
          Adds live image calibration through SpiceAPI:
          - `resize.image_resize_get`: read the current state and four scenes.
          - `resize.image_resize_set`: adjust position and scaling without restarting.
          - `resize.image_resize_save`: persist settings; requires an API password.

          Includes Python wrappers, validation, and synchronized updates.
          See PR #1 and `src/spice2x/README.md` for API examples.

          These packages promote the successful PR CI binaries. Their source tree
          matches the merged commit exactly. This prerelease still needs testing
          on a Windows game host.
          NOTES
          printf '\nCI: https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$CI_RUN_ID" \
            >> "$RUNNER_TEMP/resize-api-release-notes.md"
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/spice2x-$RELEASE_TAG.zip" \
            "$RUNNER_TEMP/spice2x-$RELEASE_TAG-full.zip" \
            --target "$RELEASE_COMMIT" \
            --title "spice2x Resize API 2026-10-16" \
            --notes-file "$RUNNER_TEMP/resize-api-release-notes.md" \
            --prerelease
