name: Publish validated XP OpenGL Release

on:
  push:
    branches: [release/resize-api-2026-10-16]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: cfb79364912dffc28ecf64f21b66d3440da3ddc9
      CI_HEAD_SHA: 15733aca07df522b6ea40a227d59439eed08d81a
      CI_RUN_ID: '38786882041'
      RELEASE_TAG: 26-10-16-xp-opengl.2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cfb79364912dffc28ecf64f21b66d3440da3ddc9
          fetch-depth: 0
      - name: Verify successful CI and matching source tree
        run: |
          test "$(gh run view "$CI_RUN_ID" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$CI_RUN_ID" --json headSha --jq .headSha)" = "$CI_HEAD_SHA"
          git fetch origin "$CI_HEAD_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$CI_HEAD_SHA^{tree}")"
      - name: Verify resize API behavior
        working-directory: src/spice2x
        run: |
          python3 api/tests/run_resize_tests.py
          python3 api/tests/run_control_tests.py
      - name: Download validated CI binaries
        run: |
          artifact=$(gh api "repos/$GH_REPO/actions/runs/$CI_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name')
          test -n "$artifact"
          gh run download "$CI_RUN_ID" --name "$artifact" --dir "$RUNNER_TEMP/resize-ci"
          test -f "$RUNNER_TEMP/resize-ci/spice2x/spice.exe"
          test -f "$RUNNER_TEMP/resize-ci/spice2x/spice64.exe"
          test -f "$RUNNER_TEMP/resize-ci/spice2x/extras/winxp/spice.exe"
          test -f "$RUNNER_TEMP/resize-ci/spice2x/extras/winxp/spicecfg.exe"
      - name: Package standard and full distributions
        run: |
          cd "$RUNNER_TEMP/resize-ci/spice2x"
          zip -qrXT9 "$RUNNER_TEMP/spice2x-$RELEASE_TAG.zip" . -x 'extras/*'
          zip -qrXT9 "$RUNNER_TEMP/spice2x-$RELEASE_TAG-full.zip" .
      - name: Package XP executables
        run: |
          mkdir "$RUNNER_TEMP/xp-package"
          cp "$RUNNER_TEMP/resize-ci/spice2x/extras/winxp/spice.exe" "$RUNNER_TEMP/xp-package/"
          cp "$RUNNER_TEMP/resize-ci/spice2x/extras/winxp/spicecfg.exe" "$RUNNER_TEMP/xp-package/"
          cp LICENSE "$RUNNER_TEMP/xp-package/LICENSE.txt"
          cat > "$RUNNER_TEMP/xp-package/README.txt" <<'README'
          XP 32-bit executables for an existing spice2x installation.
          Back up and replace the existing XP spice.exe and spicecfg.exe.
          Preserve existing game files, modules and launch arguments.
          Includes XP-compatible power-off and experimental legacy jubeat OpenGL
          calibration. WGL behavior, legacy GPU drivers and actual XP shutdown
          still require testing on the target machine.
          README
          cd "$RUNNER_TEMP/xp-package"
          zip -qrXT9 "$RUNNER_TEMP/spice2x-$RELEASE_TAG-winxp.zip" .
      - name: Publish prerelease
        run: |
          cat > "$RUNNER_TEMP/resize-api-release-notes.md" <<'NOTES'
          Scopes XP-specific fixes to SPICE_XP builds and retains shared correctness fixes.

          - XP builds use compatible power-off flags; non-XP builds retain their existing hybrid-shutdown policy.
          - Native shutdown/reboot errors include Windows error codes.
          - Shutdown privilege handles are cleaned up and failures are checked.
          - A jubeat-only OpenGL 1.1 transform is compiled and initialized only with SPICE_XP. It applies scale, offsets, filtering
            and duplication at buffer swap, preserving game rendering state
            in a separate context. Existing native I/O and launch arguments are retained.
          - The `-winxp.zip` contains the XP 32-bit spice.exe and spicecfg.exe.
            Back up the existing executables before replacing them. The standard
            ZIP contains the regular binaries; the full ZIP also includes XP extras.

          Validation: all existing CI builds, 145 production resize checks,
          400 concurrent updates, inert native control/privilege regression tests,
          and real Mesa EGL pixel tests for scaling, offsets and duplication. The control tests cover both SPICE_XP=0 and SPICE_XP=1; compiler logs confirm no OpenGL source builds outside XP.
          WGL hooks, ATI legacy drivers and actual Windows XP power-off still
          need target-machine testing. This is an experimental prerelease.
          See PR #3. Main and the source PR have no workflow changes. Existing revision 1 XP executables retain the same XP behavior and can continue to be tested.
          NOTES
          printf '\nCI: https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$CI_RUN_ID" \
            >> "$RUNNER_TEMP/resize-api-release-notes.md"
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/spice2x-$RELEASE_TAG.zip" \
            "$RUNNER_TEMP/spice2x-$RELEASE_TAG-full.zip" \
            "$RUNNER_TEMP/spice2x-$RELEASE_TAG-winxp.zip" \
            --target "$RELEASE_COMMIT" \
            --title "spice2x XP-scoped fixes and OpenGL calibration (revision 2)" \
            --notes-file "$RUNNER_TEMP/resize-api-release-notes.md" \
            --prerelease
