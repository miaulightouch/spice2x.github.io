name: Release

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/spice2x
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
      - name: Clean leftover build artifacts
        run: |
          rm -rf .ccache dist bin cmake-build-*
      - name: Test image resize API
        run: python3 api/tests/run_resize_tests.py
      - name: Compile
        run: ./build_docker.sh
      - name: Determine release name from dist filename
        env:
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          dist=$(basename "$(ls dist/spice2x-*.zip | grep -v -- '-full.zip')")
          # strip the ".zip" to get the base name, e.g. spice2x-26-06-28
          name="${dist%.zip}"
          # the tag is the date portion, e.g. 26-06-28
          tag="${name#spice2x-}"
          # Labelled PR merges publish a distinct release; manual runs remain drafts.
          if [ -n "$RELEASE_PR_NUMBER" ]; then
            name="${name}-pr${RELEASE_PR_NUMBER}"
            tag="${tag}-pr${RELEASE_PR_NUMBER}"
          fi
          echo "RELEASE_NAME=$name" >> $GITHUB_ENV
          echo "RELEASE_TAG=$tag" >> $GITHUB_ENV
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || 'main' }}
          generate_release_notes: true
          files: |
            src/spice2x/dist/spice2x-*.zip
